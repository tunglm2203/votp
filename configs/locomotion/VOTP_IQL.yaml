alg: PIQL
alg_kwargs:
  expectile: 0.7
  beta: 0.33333333
  clip_score: 100.0
  reward_steps: 20000
  reward_loss_type: ce

optim: Adam
optim_kwargs:
  lr: 0.0003
  reward:
    lr: 0.0001

network: ActorCriticValueRewardSpecialPolicy
network_kwargs:
  actor_class: DiagonalGaussianMLPActor
  actor_kwargs:
    log_std_bounds: [-5, 2]
    output_act: ["import", "torch.nn", "Tanh"]
    state_dependent_log_std: False
    log_std_tanh: False
    squash_normal: False
  critic_class: ContinuousMLPCritic
  critic_kwargs:
    ensemble_size: 2
  value_class: MLPValue
  value_kwargs:
    ensemble_size: 1
  reward_class: ContinuousMLPCritic # DrQv2RewardNoAction, DrQv2Reward, ContinuousMLPCritic
  reward_kwargs:
    ensemble_size: 1
  hidden_layers: [256, 256]
  ortho_init: True
  image_size: 84

eval_env: hopper-medium-replay-v2

dataset: ReplayAndFeedbackBuffer
dataset_kwargs:
  # Config for offline dataset
  replay_class: D4RL_OfflineDataset
  replay_kwargs:
    name: hopper-medium-replay-v2
    distributed: False
    batch_size: 256
    discount: 0.99
    normalize_reward: True
    action_eps: 0.00001   # necessary to prevent NaN in the dataset.

  # Config for offline feedback dataset
  feedback_class: D4RL_FeedbackDataset
  feedback_kwargs:
    path: null
    discount: 0.99
    batch_size: 8
    segment_size: 100
    subsample_size: 64

    equal_pref_threshold_teacher: 0.0
    human_label: False
    use_pseudo_label: False
    preference_threshold: 0  # Threshold to judge preferred segment based on its preference score
    n_queries: 10000
    env_name: null
    entropic_reg: 0.01
    n_labels: 10
    max_pairs: 10000
    seed: -1

schedule:
  actor: ["import", "torch.optim.lr_scheduler", "CosineAnnealingLR"]
  reward: ["import", "torch.optim.lr_scheduler", "CosineAnnealingLR"]
schedule_kwargs:
  actor:
    T_max: 1000000  # matches the total number of steps to train: trainer_kwargs.total_steps
  reward:
    T_max: 20000
    eta_min: 0.00005

processor: null

trainer_kwargs: # Arguments given to Algorithm.train
  total_steps: 1000000 # The total number of steps to train
  log_freq: 500 # How often to log values
  eval_freq: 10000 # How often to run evals
  eval_fn: eval_policy
  eval_kwargs:
    num_ep: 25 # Number of enviornment episodes to run for evaluation
  loss_metric: reward # The validation metric that determines when to save the "best_checkpoint"
  train_dataloader_kwargs:
    num_workers: 0
    batch_size: null
    collate_fn: null
  profile_freq: 500

seed: null
