[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research"
version = "0.0.1"
description = "VOTP: Video-based Optimal Transport Preference learning."
requires-python = ">=3.8"
authors = [
    { name = "Tung Luu", email = "tungluu2203@kaist.ac.kr" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
include = ["research*"]

[tool.black]
line-length = 120
target-version = ["py38", "py39"]
preview = true

[tool.isort]
profile = "black"
line_length = 120
skip = ["__init__.py"]
filter_files = true
py_version = "all"
